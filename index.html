<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco 24 horas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Caixa Eletronico 24 horas</h1>
    <h2 id="saldo" >Saldo: R$ 0,00</h2>

    <input type="number" id="valorDeposito" placeholder="Velor a depositar">
    <button onclick="caixa.deposito()">Depositar</button>

    <input type="number" id="valorSaque" placeholder="Valor a sacar">
    <button onclick="caixa.sacar()">Sacar</button>
    
    <script src="script.js"></script>
    
</body>
</html>
