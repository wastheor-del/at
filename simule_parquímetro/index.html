<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parquimetro Digital</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="caixa">
        <h1>Parquimetro</h1>

        <p>Valor: <b>R$ <span id="saldo">0,00</span></b></p>
        <p>Valor: <b><span id="tempo">0</span> min</b></p>
                
        <div>
            <input type="number" id="valInput" step="0.50" placeholder="Digite o valor (ex: 2.50)">
            <button onclick="digValor()">Insira o valor</button>
        </div>
        
        <p>Botão rápido</p>
        <div class="btnB">
            <button onclick="colMoeda(1.00)">+ R$ 1,00 (30 min)</button>
            <button onclick="colMoeda(2.00)">+ R$ 2,00 (60 min)</button>
        </div>

        <button class="btnPegar" onclick="pegar()">Pagar e Imprimir</button>
        <div id="fixa"></div>
    
    </div>

    <script src="script.js"></script>
</body>
</html>
